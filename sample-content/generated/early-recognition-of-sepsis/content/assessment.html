<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Knowledge Check</title>
    <link rel="stylesheet" type="text/css" href="../shared/style.css" />
    <script type="text/javascript">
        var questions = [
            {
                text: "Sepsis is best described as:",
                answers: [
                    "A specific bacterial infection of the bloodstream only",
                    "The body's life-threatening, dysregulated response to infection",
                    "A type of allergic reaction",
                    "A chronic condition unrelated to infection"
                ],
                correctIndex: 1
            },
            {
                text: "Which qSOFA finding reflects altered mental status?",
                answers: ["New confusion", "Low urine output", "Skin mottling", "Elevated lactate"],
                correctIndex: 0
            },
            {
                text: "A systolic blood pressure of 100 mmHg or less is a component of which bedside screening tool?",
                answers: ["SIRS", "qSOFA", "Sepsis Six", "None of these"],
                correctIndex: 1
            },
            {
                text: "Within what timeframe is the Sepsis Six bundle intended to be started once sepsis is suspected?",
                answers: ["Within 24 hours", "Within the first hour", "Within one week", "There is no specific timeframe"],
                correctIndex: 1
            },
            {
                text: "Which of the following is part of the Sepsis Six bundle?",
                answers: [
                    "Scheduling a follow-up outpatient visit",
                    "Discontinuing all IV fluids",
                    "Taking blood cultures and giving IV antibiotics promptly",
                    "Waiting for a specialist consult before any action"
                ],
                correctIndex: 2
            }
        ];

        function renderTest(){
            var container = document.getElementById("test");
            var html = "";
            for (var i = 0; i < questions.length; i++){
                var q = questions[i];
                html += "<div class='question' id='q" + i + "'>";
                html += "<p class='q-text'>" + (i + 1) + ". " + q.text + "</p>";
                for (var a = 0; a < q.answers.length; a++){
                    html += "<div class='answer'><label>";
                    html += "<input type='radio' name='question_" + i + "' value='" + a + "'/> ";
                    html += q.answers[a];
                    html += "</label></div>";
                }
                html += "</div>";
            }
            container.innerHTML = html;
        }

        function submitAnswers(){
            var correctCount = 0;

            for (var i = 0; i < questions.length; i++){
                var q = questions[i];
                var selected = document.getElementsByName("question_" + i);
                var learnerAnswer = -1;
                for (var s = 0; s < selected.length; s++){
                    if (selected[s].checked){
                        learnerAnswer = parseInt(selected[s].value, 10);
                    }
                }
                if (learnerAnswer == q.correctIndex){
                    correctCount++;
                }
            }

            var score = Math.round((correctCount / questions.length) * 100);
            var resultsDiv = document.getElementById("results");
            var passed = score >= 70;

            resultsDiv.className = passed ? "pass" : "fail";
            resultsDiv.innerHTML = "<h3>Your score: " + score + "%</h3>" +
                "<p>You answered " + correctCount + " out of " + questions.length + " questions correctly.</p>" +
                "<p>" + (passed ? "You passed this assessment." : "You did not reach the 70% passing threshold. Review the material and try again if you'd like, but your result has been recorded.") + "</p>";
            resultsDiv.style.display = "block";

            document.getElementById("submitBtn").disabled = true;

            if (parent && parent.RecordTest){
                parent.RecordTest(score);
            }
        }

        window.onload = function(){
            renderTest();
        };
    </script>
</head>
<body>
    <div class="page-wrap">
        <h1>Knowledge Check: Early Recognition of Sepsis</h1>
        <p>Answer all questions, then submit to see your score. You need 70% or higher to pass.</p>
        <div id="test"></div>
        <input type="button" id="submitBtn" value="Submit Answers" onclick="submitAnswers();" />
        <div id="results" style="display:none;"></div>
    </div>
</body>
</html>
